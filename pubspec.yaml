name: resumely
description: "Resumely - AI Mobile Resume Builder"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.5
  sort_pubspec_dependencies: ^0.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#141318"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#141318"
    theme_color: "#9E63F8"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#141318"
  image: "assets/icons/splash_logo.png"
  color_dark: "#141318"
  image_dark: "assets/icons/splash_logo.png"
  android_12:
    image: "assets/icons/splash_logo.png"
    color: "#141318"
    icon_background_color: "#141318"
    image_dark: "assets/icons/splash_logo.png"
    color_dark: "#141318"
    icon_background_color_dark: "#141318"
  android: true
  ios: true
  web: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/svg/
    - fonts/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: fonts/SpaceGrotesk.ttf
